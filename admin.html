<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel Admin v3.0 — Quản trị toàn quyền BroJect V7.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#07090d;--bg2:#0c1018;--surface:rgba(20,26,38,.72);--surface2:rgba(28,36,52,.6);--border:rgba(120,160,220,.12);--border2:rgba(120,160,220,.22);--fg:#e6eefc;--fg2:#8fa2c0;--fg3:#5a6b85;--cyan:#22d3ee;--blue:#3b82f6;--violet:#a855f7;--pink:#ec4899;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--grad:linear-gradient(135deg,#22d3ee,#3b82f6 45%,#a855f7);--shadow:0 20px 60px rgba(0,0,0,.55);--glow:0 0 30px rgba(34,211,238,.35)}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;font-size:14px;background-image:radial-gradient(circle at 15% 15%,rgba(34,211,238,.10),transparent 45%),radial-gradient(circle at 85% 85%,rgba(168,85,247,.10),transparent 45%)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(120,160,220,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,220,.03) 1px,transparent 1px);background-size:44px 44px;animation:gridMove 20s linear infinite}
@keyframes gridMove{from{background-position:0 0}to{background-position:44px 44px}}
.hidden{display:none!important}
body.light{--bg:#eef2f8;--surface:rgba(255,255,255,.85);--fg:#0d1526;--fg2:#4a5878;--fg3:#8091ad}
body.light .field input,body.light .field textarea,body.light .field select,body.light .console-out,body.light .console-input input{background:rgba(255,255,255,.7)}

/* LOCK */
#lock{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{position:relative;width:100%;max-width:440px;background:var(--surface);backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:24px;padding:44px 36px;text-align:center;box-shadow:var(--shadow),var(--glow);overflow:hidden}
.lock-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.lock-emblem{width:78px;height:78px;margin:0 auto 22px;border-radius:22px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(34,211,238,.5);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lock-emblem svg{width:38px;height:38px;stroke:#001018;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lock-card h1{font-size:22px;font-weight:800;letter-spacing:3px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.lock-card .sub{color:var(--fg2);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:30px}
.lock-input{position:relative;margin-bottom:16px}
.lock-input input{width:100%;padding:16px 50px 16px 18px;background:rgba(0,0,0,.5);border:1px solid var(--border2);color:var(--fg);border-radius:14px;font-size:15px;font-family:inherit;outline:none;text-align:center;letter-spacing:3px}
body.light .lock-input input{background:rgba(255,255,255,.7)}
.lock-input input:focus{border-color:var(--cyan);box-shadow:0 0 20px rgba(34,211,238,.35)}
.lock-input input.error{border-color:var(--red);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lock-input .eye{position:absolute;right:16px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--fg3);font-size:16px}
.lock-btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--grad);color:#001018;font-weight:800;font-size:14px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:inherit}
.lock-btn:hover{transform:translateY(-2px)}
.lock-btn:disabled{opacity:.5;cursor:wait}
.lock-msg{margin-top:16px;font-size:12px;min-height:16px;color:var(--red);letter-spacing:1px;font-weight:600}
.lock-msg.ok{color:var(--green)}
.lock-hint{margin-top:20px;font-size:10.5px;color:var(--fg3);line-height:1.6}
.lock-hint code{background:rgba(34,211,238,.12);color:var(--cyan);padding:2px 7px;border-radius:5px;font-family:monospace}

/* APP */
#app{display:grid;grid-template-columns:260px 1fr;height:100vh;width:100vw;opacity:0;transition:opacity .35s}
#app.ready{opacity:1}
.sidebar{background:var(--surface);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 12px 16px;gap:4px;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 16px;margin-bottom:8px;border-bottom:1px solid var(--border)}
.brand-logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(34,211,238,.4)}
.brand-logo svg{width:20px;height:20px;stroke:#001018;fill:none;stroke-width:2.2;stroke-linecap:round}
.brand-text b{font-size:14px;letter-spacing:1.5px;font-weight:800;white-space:nowrap;display:block}
.brand-text small{font-size:9px;color:var(--fg3);letter-spacing:2px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:1px;flex:1}
.nav-title{font-size:9px;color:var(--fg3);letter-spacing:2px;text-transform:uppercase;padding:11px 8px 3px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:9px;cursor:pointer;color:var(--fg2);font-size:12px;font-weight:500;transition:.15s;position:relative}
.nav-item:hover{background:var(--surface2);color:var(--fg)}
.nav-item.active{background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(168,85,247,.08));color:var(--fg)}
.nav-item.active::before{content:'';position:absolute;left:0;top:15%;bottom:15%;width:3px;background:var(--grad);border-radius:2px}
.nav-item .ico{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-item .ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item .badge{margin-left:auto;background:var(--surface2);color:var(--fg2);font-size:9px;padding:1px 6px;border-radius:20px;border:1px solid var(--border)}
.nav-item.active .badge{background:rgba(34,211,238,.2);color:var(--cyan);border-color:rgba(34,211,238,.3)}
.side-foot{margin-top:8px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sess{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:9px;color:var(--green);font-size:10px;font-family:monospace}
.sess.off{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.25);color:var(--red)}
.sess i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(12,16,24,.5);backdrop-filter:blur(16px);gap:12px;flex-wrap:wrap}
.topbar h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.topbar h2 small{font-size:11px;color:var(--fg3);font-weight:500;letter-spacing:1px}
.top-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:8px 13px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.btn.primary{background:var(--grad);border:none;color:#001018;font-weight:800}
.btn.danger{border-color:rgba(239,68,68,.35);color:#fca5a5}
.btn.danger:hover{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red)}
.btn.warn{border-color:rgba(245,158,11,.35);color:#fcd34d}
.btn.warn:hover{background:rgba(245,158,11,.1);border-color:var(--amber);color:var(--amber)}
.btn.sm{padding:5px 10px;font-size:10.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.content{flex:1;overflow-y:auto;padding:22px}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.page{display:none;animation:fadeUp .3s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-head{margin-bottom:20px}
.page-head h3{font-size:19px;font-weight:700;margin-bottom:4px}
.page-head p{color:var(--fg2);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;transition:.2s}
.stat:hover{border-color:var(--border2);transform:translateY(-2px)}
.stat .ico{width:32px;height:32px;border-radius:9px;background:rgba(34,211,238,.1);display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:var(--cyan)}
.stat .ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.stat .lbl{color:var(--fg3);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.stat .num{font-size:20px;font-weight:800;margin-top:4px;word-break:break-word}
.stat.violet .ico{background:rgba(168,85,247,.1);color:var(--violet)}
.stat.green .ico{background:rgba(34,197,94,.1);color:var(--green)}
.stat.amber .ico{background:rgba(245,158,11,.1);color:var(--amber)}
.stat.pink .ico{background:rgba(236,72,153,.1);color:var(--pink)}
.stat.red .ico{background:rgba(239,68,68,.1);color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.panel h4{font-size:13.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h4 svg{width:15px;height:15px;stroke:var(--cyan);fill:none;stroke-width:2}
.panel h4 .p-badge{margin-left:auto;font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.25);font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:var(--fg3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;background:rgba(0,0,0,.4);border:1px solid var(--border2);color:var(--fg);border-radius:9px;font-family:inherit;font-size:13px;outline:none;transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.field textarea{resize:vertical;min-height:100px;font-family:'JetBrains Mono','Courier New',monospace;font-size:12.5px;line-height:1.55}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1;min-width:160px;margin-bottom:12px}
.hint{font-size:11px;color:var(--fg3);line-height:1.55;margin-top:4px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;transition:.15s;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item:hover{border-color:var(--border2)}
.item-title{font-weight:700;font-size:12.5px;color:var(--fg);flex:1;min-width:140px;word-break:break-all}
.item-meta{font-size:11px;color:var(--fg3);font-family:monospace}
.item-actions{display:flex;gap:5px;margin-left:auto}
.empty{text-align:center;padding:40px 20px;color:var(--fg3);font-size:13px}
.empty svg{width:40px;height:40px;stroke:var(--fg3);fill:none;stroke-width:1.5;margin-bottom:12px;opacity:.5}
.log-item{display:flex;gap:10px;padding:8px 11px;border-left:2px solid var(--border2);font-family:monospace;font-size:11px;color:var(--fg2);border-radius:0 7px 7px 0;margin-bottom:2px;flex-wrap:wrap}
.log-item:hover{background:var(--surface2);border-left-color:var(--cyan)}
.log-item b{color:var(--cyan);flex-shrink:0}
.log-item .t{margin-left:auto;color:var(--fg3);flex-shrink:0;font-size:10px}
.chip{display:inline-block;padding:3px 8px;border-radius:20px;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.chip.cyan{background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.25)}
.chip.green{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.chip.amber{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.chip.pink{background:rgba(236,72,153,.12);color:var(--pink);border:1px solid rgba(236,72,153,.25)}
.chip.violet{background:rgba(168,85,247,.12);color:var(--violet);border:1px solid rgba(168,85,247,.25)}
.chip.red{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}

/* CONSOLE */
.console-out{background:rgba(0,0,0,.6);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;min-height:320px;max-height:520px;overflow-y:auto;line-height:1.65;white-space:pre-wrap;word-break:break-all}
.console-out::-webkit-scrollbar{width:6px}
.console-out::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.console-line{color:var(--fg2);margin-bottom:2px}
.console-line.ok{color:var(--green)}
.console-line.err{color:var(--red)}
.console-line.warn{color:var(--amber)}
.console-line.info{color:var(--cyan)}
.console-line.cmd{color:var(--violet);font-weight:600}
.console-line .in{color:var(--cyan)}
.console-input{display:flex;gap:6px;margin-top:10px}
.console-input input{flex:1;padding:12px 14px;background:rgba(0,0,0,.5);border:1px solid var(--border2);color:var(--cyan);border-radius:9px;font-family:'JetBrains Mono',monospace;font-size:13px;outline:none}
.console-input input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px;max-height:400px;overflow-y:auto}
.cmd-btn{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;color:var(--fg);font-size:11.5px;display:flex;flex-direction:column;gap:3px}
.cmd-btn:hover{border-color:var(--cyan);background:rgba(34,211,238,.05);transform:translateY(-1px)}
.cmd-btn b{color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700}
.cmd-btn small{color:var(--fg3);font-size:10px}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:5px}
.toggle-row:hover{border-color:var(--border2)}
.toggle-row .tname{flex:1;font-size:12px;font-weight:600}
.toggle-row .tgroup{font-size:9.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:1px;font-family:monospace}
.toggle-switch{position:relative;width:42px;height:22px;background:rgba(0,0,0,.5);border:1px solid var(--border2);border-radius:11px;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--fg3);transition:.2s}
.toggle-switch.on{background:rgba(34,211,238,.25);border-color:var(--cyan)}
.toggle-switch.on::after{left:22px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

/* TOAST */
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none}
.toast{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border2);border-left:3px solid var(--cyan);padding:12px 16px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.5);min-width:200px;animation:slideIn .3s ease;display:flex;align-items:center;gap:10px}
.toast.err{border-left-color:var(--red);color:#fca5a5}
.toast.ok{border-left-color:var(--green);color:#86efac}
.toast.warn{border-left-color:var(--amber);color:#fcd34d}
.toast svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

.modal{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:22px;max-width:720px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal-card h3 svg{width:16px;height:16px;stroke:var(--cyan);fill:none;stroke-width:2}

.menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:999;width:42px;height:42px;border-radius:11px;background:var(--surface);border:1px solid var(--border2);color:var(--fg);cursor:pointer;align-items:center;justify-content:center}
.menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
@media(max-width:820px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:998;transform:translateX(-100%);transition:.25s;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .content{padding:14px}
  .topbar{padding:12px 14px 12px 66px}
  .top-actions .btn span{display:none}
}
pre.code-box{margin:0;background:rgba(0,0,0,.6);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:7px;padding:12px;overflow-x:auto;font-family:'JetBrains Mono','Fira Code',monospace;font-size:12px;line-height:1.6;max-height:420px;white-space:pre}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;gap:12px}
.kv b{color:var(--fg2);font-weight:600;flex-shrink:0}
.kv span{word-break:break-all;text-align:right}
</style>
</head>
<body>

<button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
  <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<div id="lock">
  <div class="lock-card">
    <div class="lock-emblem"><svg viewBox="0 0 24 24"><path d="M12 2L3 6v6c0 5 3.5 9.5 9 10 5.5-.5 9-5 9-10V6l-9-4z"/><circle cx="12" cy="10" r="2"/><path d="M12 12v3"/></svg></div>
    <h1>SENTINEL ADMIN</h1>
    <div class="sub">Full Control · v3.0</div>
    <div class="lock-input">
      <input type="password" id="adminPwd" placeholder="••••••••" autocomplete="off">
      <span class="eye" id="eyeBtn" onclick="toggleEye()">◉</span>
    </div>
    <button class="lock-btn" id="loginBtn" onclick="tryLogin()">🔓 ĐĂNG NHẬP</button>
    <div class="lock-msg" id="lockMsg"></div>
    <div class="lock-hint">
      Mật khẩu mặc định: <code>admin123</code><br>
      <span style="opacity:.7">Đổi ngay trong Config sau khi vào</span>
    </div>
  </div>
</div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M12 2L3 6v6c0 5 3.5 9.5 9 10 5.5-.5 9-5 9-10V6l-9-4z"/><circle cx="12" cy="10" r="2"/><path d="M12 12v3"/></svg></div>
      <div class="brand-text"><b>SENTINEL ADMIN</b><small>Full Control · v3.0</small></div>
    </div>
    <nav class="nav" id="navRoot"></nav>

      <div class="sess" id="vaultSess"><i></i><span>VAULT <b id="vaultStatus">OFFLINE</b></span></div>

}

/* ============= CHANNEL ============= */
function initChannel(){
  try {
    CHANNEL = new BroadcastChannel('sentinel-admin');
    CHANNEL.onmessage = (e) => {
      const d = e.data || {};
      if(d.type === 'pong'){
        VAULT_ONLINE = true; VAULT_LAST_PING = Date.now();
        VAULT_STATE.locked = !!d.locked;
        VAULT_STATE.page = d.page || 'dash';
        updateVaultStatus();
      } else if(d.type === 'heartbeat'){
        VAULT_ONLINE = true; VAULT_LAST_PING = Date.now();
        VAULT_STATE.locked = !!d.locked;
        VAULT_STATE.page = d.page || 'dash';
        updateVaultStatus();
      } else if(d.type === 'cmd-ok'){
        pushConsole('✓ Vault: ' + (d.msg || 'OK'), 'ok');
        resolvePending(d.cmd, { ok:true, msg:d.msg });
      } else if(d.type === 'cmd-err'){
        pushConsole('✗ Vault: ' + (d.msg || 'Error'), 'err');
        resolvePending(d.cmd, { ok:false, msg:d.msg });
      } else if(d.type === 'cmd-data'){
        pushConsole('📥 Vault data:', 'info');
        try { pushConsole(JSON.stringify(d.data, null, 2), 'info'); } catch(e){}
        resolvePending(d.cmd, { ok:true, data:d.data });
      }
    };
  } catch(e){ console.warn('BroadcastChannel lỗi:', e); }
}
function resolvePending(cmd, result){
  if(!cmd) return;
  for(const [key, resolve] of CMD_PENDING){
    if(key.startsWith(cmd+'::')){
      clearTimeout(CMD_PENDING.get(key)?.timer);
      resolve(result);
      CMD_PENDING.delete(key);
      break;
    }
  }
}
function sendCmdWithReply(cmd, timeout=CMD_REPLY_TIMEOUT){
  return new Promise((resolve) => {
    if(!CHANNEL){ resolve({ok:false, msg:'Channel chưa khởi tạo'}); return; }
    const key = cmd + '::' + Date.now() + Math.random().toString(36).slice(2,6);
    const timer = setTimeout(()=>{ CMD_PENDING.delete(key); resolve({ok:false, msg:'Timeout sau '+timeout+'ms'}); }, timeout);
    CMD_PENDING.set(key, Object.assign(resolve, { timer }));
    try { CHANNEL.postMessage({ type:'admin-cmd', cmd }); }
    catch(e){ clearTimeout(timer); CMD_PENDING.delete(key); resolve({ok:false, msg:e.message}); }
  });
}
function sendCmd(cmd){
  if(!CHANNEL){ pushConsole('✗ Channel chưa sẵn sàng', 'err'); return; }
  try { CHANNEL.postMessage({ type:'admin-cmd', cmd }); }
  catch(e){ pushConsole('✗ Lỗi gửi: '+e.message, 'err'); }
}
function pingVault(showToast){
  if(!CHANNEL) return;
  try { CHANNEL.postMessage({ type:'admin-ping' }); }
  catch(e){}
  if(showToast) setTimeout(()=>{
    if(Date.now() - VAULT_LAST_PING < 2000) toast('Vault online ✓', 'ok');
    else toast('Vault offline', 'warn');
  }, 500);
}

  el.textContent = online ? 'ONLINE' : 'OFFLINE';
  if(wrap) wrap.classList.toggle('off', !online);
}

function renderStats(){
  const logs = JSON.parse(localStorage.getItem(VAULT_KEYS.logs) || '[]');
  const byAction = {};
  logs.forEach(l=>{ byAction[l.action] = (byAction[l.action]||0)+1; });
  const topActions = Object.entries(byAction).sort((a,b)=>b[1]-a[1]).slice(0,10);

  const byDay = {};
  logs.forEach(l=>{ const d = new Date(l.t).toISOString().slice(0,10); byDay[d]=(byDay[d]||0)+1; });
  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    last7.push({ day:d, count:byDay[d]||0 });
  }
  const maxDay = Math.max(1,...last7.map(x=>x.count));

  $('content').innerHTML = `

      <div class="stats">
        <div class="stat"><div class="lbl">Tổng logs</div><div class="num">${logs.length}</div></div>

      </div>

        <h4><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Hoạt động 7 ngày</h4>
        <div style="display:flex;align-items:flex-end;gap:6px;height:140px;padding:10px 0;border-bottom:1px solid var(--border)">
          ${last7.map(x=>`
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px">
              <div style="width:100%;max-width:40px;background:var(--grad);border-radius:5px 5px 0 0;height:${(x.count/maxDay)*100}%;min-height:4px"></div>
              <small style="font-size:9px;color:var(--fg3)">${x.day.slice(5)}<br><b>${x.count}</b></small>

      <div class="panel">
        <h4><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16"/></svg>Top action</h4>
        <div class="list">
          ${topActions.map(([a,c])=>`
            <div class="item">
              <div class="item-title">${esc(a)}</div>
              <div class="item-meta">${c} lần</div>

        </div>
      </div>
    </div>
  `;
}

    logCmd('lock', r.msg);
  });
}
function ctrlReload(){
  sendCmdWithReply('reload').then(r=>{
    if(r.ok) toast('🔄 Vault đang reload', 'ok'); else toast('Lỗi: '+(r.msg||'?'), 'err');

}

      openModal(`<h3><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg>Vault dump</h3>

function ctrlDialog(){

function viewKey(key){
  const v = localStorage.getItem(key);
  if(v === null) return toast('Không tồn tại', 'err');
  openModal(`
    <h3><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg>Key: ${esc(key)}</h3>
    <div class="field"><label>Giá trị (${fmtBytes(v.length)})</label>
    <textarea readonly style="min-height:200px">${esc(v.slice(0, 8000))}${v.length > 8000 ? '\n\n... (' + (v.length - 8000) + ' bytes nữa)' : ''}</textarea></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
      <button class="btn" onclick="copyKey('${esc(key)}')">📋 Copy</button>
      <button class="btn" onclick="editKey('${esc(key)}')">✏️ Sửa</button>
      <button class="btn danger" onclick="delKey('${esc(key)}');closeModal()">🗑 Xóa</button>
      <button class="btn" onclick="closeModal()">Đóng</button>
    </div>
  `);
}
function copyKey(key){
  const v = localStorage.getItem(key);
  if(v === null) return;
  navigator.clipboard.writeText(v).then(()=>toast('Đã copy', 'ok'));
}
function editKey(key){
  const v = localStorage.getItem(key);
  openModal(`
    <h3><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Sửa: ${esc(key)}</h3>
    <div class="field"><label>Giá trị mới</label><textarea id="editValue" style="min-height:200px">${esc(v||'')}</textarea></div>
    <div style="display:flex;gap:6px;justify-content:flex-end">
      <button class="btn primary" onclick="saveEditKey('${esc(key)}')">💾 Lưu</button>
      <button class="btn" onclick="closeModal()">Hủy</button>
    </div>
  `);
}
function saveEditKey(key){
  localStorage.setItem(key, $('editValue').value);
  toast('Đã lưu', 'ok');
  closeModal();
  refreshAll();
}
function delKey(key){
  if(!confirm('Xóa key "'+key+'"? Không thể phục hồi!')) return;
  localStorage.removeItem(key);
  toast('Đã xóa', 'ok');
  refreshAll();
}
function changeAdminPwd(){
  const p1 = $('newAdminPwd').value;
  const p2 = $('newAdminPwd2').value;
  if(!p1) return toast('Chưa nhập mật khẩu', 'err');
  if(p1.length < 4) return toast('Mật khẩu ≥ 4 ký tự', 'err');
  if(p1 !== p2) return toast('Mật khẩu không khớp', 'err');
  localStorage.setItem(LS_ADMIN.pwd, p1);
  $('newAdminPwd').value = '';
  $('newAdminPwd2').value = '';
  toast('Đã đổi mật khẩu admin', 'ok');
}
function saveVaultConfig(){
  localStorage.setItem(VAULT_KEYS.theme, $('cfgTheme').value);
  localStorage.setItem(VAULT_KEYS.confirm, $('cfgConfirm').value);
  localStorage.setItem(VAULT_KEYS.notif, $('cfgNotif').value);
  toast('Đã lưu cấu hình', 'ok');
  sendCmd('reload');
}
function toggle2FA(enable){
  if(enable){
    if(localStorage.getItem(VAULT_KEYS.twofaEnabled) === '1') return toast('Đã bật rồi', 'warn');
    const secret = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(10)))).slice(0, 16).toUpperCase();
    localStorage.setItem(VAULT_KEYS.twofaSecret, secret);
    localStorage.setItem(VAULT_KEYS.twofaEnabled, '1');
    toast('Đã bật 2FA', 'ok');
  } else {
    localStorage.removeItem(VAULT_KEYS.twofaSecret);
    localStorage.removeItem(VAULT_KEYS.twofaEnabled);
    toast('Đã tắt 2FA', 'warn');
  }
  refreshAll();
}
function toggleTool(id, el){
  let disabled = JSON.parse(localStorage.getItem(LS_ADMIN.toolsDisabled) || '[]');
  if(disabled.includes(id)){
    disabled = disabled.filter(x=>x!==id);
    el.classList.add('on');
    toast('Bật: '+id, 'ok');
  } else {
    disabled.push(id);
    el.classList.remove('on');
    toast('Tắt: '+id, 'warn');
  }
  localStorage.setItem(LS_ADMIN.toolsDisabled, JSON.stringify(disabled));
  updateBadges();
  // Push realtime
  if(CHANNEL) CHANNEL.postMessage({ type:'admin-cmd', cmd:'apply-tools:'+JSON.stringify(disabled) });
}
function setAllTools(disable){
  if(disable){
    if(!confirm('Tắt toàn bộ tool?')) return;
    localStorage.setItem(LS_ADMIN.toolsDisabled, JSON.stringify(VAULT_TOOLS.map(t=>t.id)));
  } else {
    localStorage.removeItem(LS_ADMIN.toolsDisabled);
  }
  toast(disable?'Đã tắt tất cả':'Đã bật tất cả', 'ok');
  renderTools();
  updateBadges();
  // Push
  const disabled = JSON.parse(localStorage.getItem(LS_ADMIN.toolsDisabled) || '[]');
  if(CHANNEL) CHANNEL.postMessage({ type:'admin-cmd', cmd:'apply-tools:'+JSON.stringify(disabled) });
}
function pushToolConfig(){
  const disabled = JSON.parse(localStorage.getItem(LS_ADMIN.toolsDisabled) || '[]');
  if(CHANNEL) CHANNEL.postMessage({ type:'admin-cmd', cmd:'apply-tools:'+JSON.stringify(disabled) });
  toast('Đã push config tới vault', 'ok');
  logCmd('push-tools', disabled.length+' tools');
}
function clearLogs(){
  if(!confirm('Xóa toàn bộ audit log?')) return;
  localStorage.removeItem(VAULT_KEYS.logs);
  toast('Đã xóa log', 'ok');
  refreshAll();
}
function exportLogs(){
  const logs = localStorage.getItem(VAULT_KEYS.logs) || '[]';
  const blob = new Blob([logs], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sentinel-logs-'+Date.now()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Đã export', 'ok');
}
function exportFull(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.startsWith('sv_')) data[k] = localStorage.getItem(k);
  }
  const out = { app:'SentinelVault', exported_by:'Sentinel Admin v3.0', version:3, exported_at:new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sentinel-full-'+Date.now()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  localStorage.setItem(VAULT_KEYS.lastbackup, Date.now().toString());
  toast('Đã export toàn bộ', 'ok');
  refreshAll();
}
function importFull(){
  const f = $('importFile').files[0];
  if(!f) return toast('Chưa chọn file', 'err');
  const r = new FileReader();
  r.onload = () => {
    try {
      const blob = JSON.parse(r.result);
      if(!blob.data) throw new Error('File không hợp lệ');
      if(!confirm('Ghi đè toàn bộ localStorage?')) return;
      Object.entries(blob.data).forEach(([k,v])=>localStorage.setItem(k,v));
      toast('Đã import', 'ok');
      refreshAll();
      sendCmd('reload');
    } catch(e){ toast('Lỗi: '+e.message, 'err'); }
  };
  r.readAsText(f);
}
function createSnapshot(){
  const dataRaw = localStorage.getItem(VAULT_KEYS.data);
  if(!dataRaw) return toast('Chưa có dữ liệu vault', 'err');
  try {
    const snaps = JSON.parse(localStorage.getItem(VAULT_KEYS.snapshots) || '[]');
    snaps.push({ t:Date.now(), payload:dataRaw });
    localStorage.setItem(VAULT_KEYS.snapshots, JSON.stringify(snaps.slice(-10)));
    toast('Đã tạo snapshot', 'ok');
    refreshAll();
  } catch(e){ toast('Lỗi: '+e.message, 'err'); }
}
function exportSnapshot(idx){
  try {
    const snaps = JSON.parse(localStorage.getItem(VAULT_KEYS.snapshots) || '[]');
    const s = snaps[idx]; if(!s) return;
    const blob = new Blob([s.payload], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'snapshot-'+idx+'-'+Date.now()+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch{}
}
function delSnapshot(idx){
  if(!confirm('Xóa snapshot này?')) return;
  try {
    const snaps = JSON.parse(localStorage.getItem(VAULT_KEYS.snapshots) || '[]');
    snaps.splice(idx, 1);
    localStorage.setItem(VAULT_KEYS.snapshots, JSON.stringify(snaps));
    toast('Đã xóa', 'ok');
    refreshAll();
  } catch{}
}
function clearSnapshots(){
  if(!confirm('Xóa toàn bộ snapshots?')) return;
  localStorage.removeItem(VAULT_KEYS.snapshots);
  toast('Đã xóa', 'ok');
  refreshAll();
}
function resetSalt(){
  if(!confirm('Reset salt? Vault cũ sẽ KHÔNG dùng được nữa!')) return;
  if(!confirm('XÁC NHẬN LẦN 2?')) return;
  localStorage.removeItem(VAULT_KEYS.salt);
  toast('Đã reset salt', 'warn');
}
function resetUI(){
  if(!confirm('Reset theme, confirm, notif về mặc định?')) return;
  localStorage.removeItem(VAULT_KEYS.theme);
  localStorage.removeItem(VAULT_KEYS.confirm);
  localStorage.removeItem(VAULT_KEYS.notif);
  toast('Đã reset UI', 'ok');
  refreshAll();
}
function wipeAll(){
  if(!confirm('💥 WIPE TOÀN BỘ?')) return;
  if(!confirm('XÁC NHẬN LẦN 2 — KHÔNG PHỤC HỒI!')) return;
  const pass = prompt('Nhập "WIPE" để xác nhận:');
  if(pass !== 'WIPE') return toast('Đã hủy', 'warn');
  Object.values(VAULT_KEYS).forEach(k => localStorage.removeItem(k));
  localStorage.removeItem(LS_ADMIN.toolsDisabled);
  localStorage.removeItem(LS_ADMIN.history);
  toast('Đã wipe toàn bộ', 'err');
  refreshAll();
  sendCmd('reload');
}
function updateBadges(){
  const logs = JSON.parse(localStorage.getItem(VAULT_KEYS.logs) || '[]');
  const dataRaw = localStorage.getItem(VAULT_KEYS.data);
  const disabled = JSON.parse(localStorage.getItem(LS_ADMIN.toolsDisabled) || '[]');
  const set = (id,v) => { const el = $(id); if(el) el.textContent = v; };
  set('bgAudit', logs.length);
  set('bgTools', disabled.length);
  set('bgVault', dataRaw ? '✓' : '0');
  set('bgCmd', CMD_LOG.length);
}
function refreshAll(){
  const active = document.querySelector('.nav-item.active')?.dataset.page || 'dash';
  go(active);
  pingVault(false);
}
function logCmd(cmd, msg){
  CMD_LOG.push({ cmd, msg: msg||'', t: Date.now() });
  if(CMD_LOG.length > 500) CMD_LOG.shift();
  localStorage.setItem(LS_ADMIN.cmdLog, JSON.stringify(CMD_LOG.slice(-100)));
  updateBadges();
}

  grid.innerHTML = CMD_LIST.map(c => `
    <button class="cmd-btn" onclick="runQuickCmd('${esc(c.cmd)}')">
      <b>${c.icon} ${esc(c.cmd)}</b>
      <small>${esc(c.desc)}</small>
    </button>
  `).join('');
}

function runQuickCmd(cmd){
  const clean = cmd.replace(/ <[^>]+>/g, '').replace(/<.*?>.*<\/.*?>/g, '').trim();
  $('consoleIn').value = clean;
  execConsole();
}
function pushConsole(msg, type=''){
  const out = $('consoleOut');
  if(!out) return;
  const line = document.createElement('div');
  line.className = 'console-line ' + type;
  line.innerHTML = msg;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}
function clearConsole(){
  $('consoleOut').innerHTML = '<div class="console-line ok">Console đã xóa.</div>';
}
function consoleKeydown(e){
  const inp = $('consoleIn');
  if(e.key === 'Enter'){ e.preventDefault(); execConsole(); }
  else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(CMD_HISTORY.length === 0) return;
    if(CMD_INDEX === -1) CMD_INDEX = CMD_HISTORY.length;
    CMD_INDEX = Math.max(0, CMD_INDEX - 1);
    inp.value = CMD_HISTORY[CMD_INDEX] || '';
  } else if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(CMD_INDEX === -1) return;
    CMD_INDEX = Math.min(CMD_HISTORY.length, CMD_INDEX + 1);
    if(CMD_INDEX >= CMD_HISTORY.length){ CMD_INDEX = -1; inp.value = ''; }
    else inp.value = CMD_HISTORY[CMD_INDEX] || '';
  }
}
function execConsole(){
  const inp = $('consoleIn');
  const raw = inp.value.trim();
  if(!raw) return;
  inp.value = '';
  CMD_HISTORY.push(raw);
  if(CMD_HISTORY.length > 200) CMD_HISTORY.shift();
  CMD_INDEX = -1;

  pushConsole(`<span class="in">admin@vault:~$</span> ${esc(raw)}`, 'cmd');
  const parts = raw.split(/\s+/);
  const c = parts[0].toLowerCase();
  const args = parts.slice(1);

  try {
    switch(c){
      case 'help': return showHelp();
      case 'clear': return clearConsole();
      case 'version': return pushConsole('ℹ️ Sentinel Admin v3.0 — Full Control', 'info');
      case 'whoami': return pushConsole('👤 admin (Owner)', 'info');
      case 'time': return pushConsole('🕒 ' + new Date().toLocaleTimeString('vi-VN'), 'info');
      case 'date': return pushConsole('📅 ' + new Date().toLocaleDateString('vi-VN'), 'info');
      case 'session-info': {
        const dur = Math.floor((Date.now() - ADMIN_START)/1000);
        pushConsole(`👤 admin · Session: ${Math.floor(dur/60)}p ${dur%60}s`, 'info');
        return;
      }
      case 'browser-info': {
        pushConsole(`🌐 UA: ${navigator.userAgent.slice(0,80)}...`, 'info');
        pushConsole(`📱 Platform: ${navigator.platform}`, 'info');
        pushConsole(`🗣 Lang: ${navigator.language}`, 'info');
        return;
      }
      case 'reload-self': location.reload(); return;

      // Vault control
      case 'ping': {
        pingVault(false);
        setTimeout(()=>{
          const online = Date.now() - VAULT_LAST_PING < 3000;
          pushConsole(online?'✓ Vault ONLINE':'✗ Vault OFFLINE', online?'ok':'warn');
        }, 500);
        return;
      }
      case 'lock':
        sendCmdWithReply('lock').then(r=>{ pushConsole(r.ok?'✓ '+(r.msg||'Vault locked'):'✗ '+(r.msg||'?'), r.ok?'ok':'err'); logCmd('lock', r.msg); });
        return;
      case 'reload':
        sendCmdWithReply('reload').then(r=>{ pushConsole(r.ok?'🔄 Reload sent':'✗ '+(r.msg||'?'), r.ok?'ok':'err'); logCmd('reload', r.msg); });
        return;
      case 'goto': {
        if(!args[0]) return pushConsole('✗ Cần page name', 'err');
        sendCmdWithReply('goto '+args[0]).then(r=>{ pushConsole(r.ok?'✓ '+(r.msg||''):'✗ '+(r.msg||'?'), r.ok?'ok':'err'); logCmd('goto', r.msg); });
        return;
      }
      case 'notify': {
        if(!args.length) return pushConsole('✗ Cần nội dung', 'err');
        sendCmd('notify '+args.join(' '));
        pushConsole('📢 Đã gửi toast', 'ok');
        logCmd('notify', args.join(' '));
        return;
      }
      case 'dialog': {
        if(!args.length) return pushConsole('✗ Cần nội dung', 'err');
        sendCmd('dialog '+args.join(' '));
        pushConsole('💬 Đã gửi dialog', 'ok');
        logCmd('dialog', args.join(' '));
        return;
      }
      case 'theme-light': sendCmd('theme-light'); pushConsole('☀️ Đã đổi', 'ok'); return;
      case 'theme-dark': sendCmd('theme-dark'); pushConsole('🌙 Đã đổi', 'ok'); return;
      case 'dump-status':
        sendCmdWithReply('dump-status').then(r=>{
          if(r.ok){
            pushConsole('📊 Vault dump:', 'info');
            try { pushConsole(JSON.stringify(r.data, null, 2), 'info'); } catch(e){}
          } else pushConsole('✗ '+(r.msg||'?'), 'err');
          logCmd('dump-status', r.msg);
        });
        return;
      case 'exec': {
        if(!args.length) return pushConsole('✗ Cần code', 'err');
        if(!confirm('⚠️ Chạy JS tùy ý trong vault?')) return;
        const code = raw.slice(5);
        sendCmdWithReply('exec '+code).then(r=>{
          pushConsole('⚡ Result:', 'info');
          try { pushConsole(JSON.stringify(r.data, null, 2), 'info'); } catch(e){}
          logCmd('exec', r.msg);
        });
        return;
      }

      // Vault check
      case 'vault-check': {
        const s = localStorage.getItem(VAULT_KEYS.data);
        pushConsole(s ? '✓ Vault data có ('+fmtBytes(s.length)+')' : '✗ Chưa có vault', s?'ok':'warn');
        return;
      }
      case 'vault-size': {
        const d = localStorage.getItem(VAULT_KEYS.data) || '';
        pushConsole(`📊 Vault: ${fmtBytes(d.length)}`, 'info');
        return;
      }
      case 'vault-at': {
        try {
          const b = JSON.parse(localStorage.getItem(VAULT_KEYS.data) || '{}');
          pushConsole(`🕒 Lưu lần cuối: ${b.at?fmtTime(b.at):'—'}`, 'info');
        } catch { pushConsole('✗ Không đọc được', 'err'); }
        return;
      }
      case 'salt-check': {
        const s = localStorage.getItem(VAULT_KEYS.salt);
        pushConsole(s ? '✓ Salt đã set' : '✗ Salt chưa set', s?'ok':'warn');
        return;
      }
      case 'verify-integrity': {
        pushConsole('🛡 Kiểm tra integrity...', 'info');
        const data = localStorage.getItem(VAULT_KEYS.data);
        const salt = localStorage.getItem(VAULT_KEYS.salt);
        if(!data) pushConsole('✗ Không có vault data', 'err');
        else if(!salt) pushConsole('✗ Không có salt', 'err');
        else {
          try {
            const b = JSON.parse(data);
            if(!b.payload) pushConsole('✗ Payload rỗng', 'err');
            else pushConsole(`✓ Vault OK (${fmtBytes(b.payload.length)})`, 'ok');
          } catch { pushConsole('✗ Data không phải JSON hợp lệ', 'err'); }
        }
        return;
      }
      case 'unlock-hint':
        pushConsole('💡 Master key mặc định: MatienThanh3108', 'info');
        pushConsole('💡 Đổi trong Vault → Settings', 'info');
        return;

      // Wipe
      case 'wipe-notes': case 'wipe-files': case 'wipe-docs':
      case 'wipe-code': case 'wipe-vault': case 'wipe-todo': {
        const target = c.slice(5);
        if(!confirm(`Wipe "${target}"? Không thể phục hồi!`)) return;
        sendCmdWithReply('wipe-'+target).then(r=>{
          pushConsole(r.ok?'💥 Đã wipe '+target:'✗ '+(r.msg||'?'), r.ok?'ok':'err');
          logCmd('wipe-'+target, r.msg);
        });
        return;
      }
      case 'wipe-all': return wipeAll();
      case 'wipe-logs':
        if(!confirm('Xóa audit log?')) return;
        localStorage.removeItem(VAULT_KEYS.logs);
        pushConsole('🗑 Đã xóa logs', 'ok');
        return;
      case 'wipe-snaps':
        if(!confirm('Xóa snapshots?')) return;
        localStorage.removeItem(VAULT_KEYS.snapshots);
        pushConsole('🗑 Đã xóa snapshots', 'ok');
        return;
      case 'wipe-notepad':
        if(!confirm('Xóa notepad?')) return;
        localStorage.removeItem(VAULT_KEYS.notepad);
        pushConsole('🗑 Đã xóa notepad', 'ok');
        return;
      case 'wipe-salt':
        if(!confirm('Reset salt? Vault cũ KHÔNG dùng được nữa!')) return;
        localStorage.removeItem(VAULT_KEYS.salt);
        pushConsole('⚠️ Đã reset salt', 'warn');
        return;

      // Storage
      case 'ls': {
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k.startsWith('sv_')) keys.push(k);
        }
        if(!keys.length) return pushConsole('Chưa có key sv_* nào', 'warn');
        keys.sort().forEach(k=>{
          const v = localStorage.getItem(k) || '';
          pushConsole(`  ${k.padEnd(30)} ${fmtBytes(v.length)}`, 'info');
        });
        return;
      }
      case 'ls-all': {
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          const v = localStorage.getItem(k) || '';
          pushConsole(`  ${k.padEnd(30)} ${fmtBytes(v.length)}`, 'info');
        }
        return;
      }
      case 'size': {
        let t = 0;
        for(let i=0;i<localStorage.length;i++) t += (localStorage.getItem(localStorage.key(i))||'').length;
        pushConsole(`📊 Tổng: ${fmtBytes(t)}`, 'info');
        return;
      }
      case 'scan': {
        pushConsole('🔍 Quét...', 'info');
        let empty = 0;
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          const v = localStorage.getItem(k) || '';
          if(v.length === 0){ empty++; pushConsole(`  ⚠️ Empty: ${k}`, 'warn'); }
        }
        pushConsole(`✓ Xong. ${empty} key rỗng.`, 'ok');
        return;
      }
      case 'get': {
        if(!args[0]) return pushConsole('✗ Cần key', 'err');
        const v = localStorage.getItem(args[0]);
        pushConsole(v === null ? '✗ Không tồn tại' : '✓ ' + v.slice(0, 300), v === null ? 'warn' : 'ok');
        return;
      }
      case 'set': {
        if(!args[0]) return pushConsole('✗ Cần key', 'err');
        const k = args[0];
        const v = raw.slice(raw.indexOf(k) + k.length).trim();
        if(!v) return pushConsole('✗ Cần value', 'err');
        localStorage.setItem(k, v);
        pushConsole(`✓ Đã set ${k}`, 'ok');
        return;
      }
      case 'del': {
        if(!args[0]) return pushConsole('✗ Cần key', 'err');
        if(!confirm('Xóa ' + args[0] + '?')) return;
        localStorage.removeItem(args[0]);
        pushConsole(`✓ Đã xóa ${args[0]}`, 'ok');
        return;
      }
      case 'count-prefix': {
        if(!args[0]) return pushConsole('✗ Cần prefix', 'err');
        let c2 = 0;
        for(let i=0;i<localStorage.length;i++){
          if(localStorage.key(i).startsWith(args[0])) c2++;
        }
        pushConsole(`# ${c2} key bắt đầu bằng "${args[0]}"`, 'info');
        return;
      }
      case 'export-key': {
        if(!args[0]) return pushConsole('✗ Cần key', 'err');
        const v = localStorage.getItem(args[0]);
        if(v === null) return pushConsole('✗ Key không tồn tại', 'err');
        const blob = new Blob([v], { type:'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = args[0] + '.txt';
        a.click();
        URL.revokeObjectURL(a.href);
        pushConsole('💾 Đã export ' + args[0], 'ok');
        return;
      }
      case 'edit': {
        if(!args[0]) return pushConsole('✗ Cần key', 'err');
        editKey(args[0]);
        return;
      }

      // Tools
      case 'tools-count': return pushConsole(`🔧 ${VAULT_TOOLS.length} tool`, 'info');
      case 'tools-disabled': {
        const d = JSON.parse(localStorage.getItem(LS_ADMIN.toolsDisabled) || '[]');
        if(!d.length) return pushConsole('✓ Không tool nào bị tắt', 'ok');
        pushConsole(`🚫 ${d.length} tool bị tắt:`, 'warn');
        d.forEach(id => pushConsole(`  - ${id}`, 'info'));
        return;
      }
      case 'tools-enable-all':
        localStorage.removeItem(LS_ADMIN.toolsDisabled);
        pushConsole('✓ Đã bật tất cả tool', 'ok');
        if(CHANNEL) CHANNEL.postMessage({ type:'admin-cmd', cmd:'apply-tools:[]' });
        return;
      case 'tools-disable-all': {
        const all = VAULT_TOOLS.map(t=>t.id);
        localStorage.setItem(LS_ADMIN.toolsDisabled, JSON.stringify(all));
        pushConsole('✗ Đã tắt tất cả tool', 'warn');
        if(CHANNEL) CHANNEL.postMessage({ type:'admin-cmd', cmd:'apply-tools:'+JSON.stringify(all) });
        return;
      }
      case 'push-tools': {
        const d = JSON.parse(localStorage.getItem(LS_ADMIN.toolsDisabled) || '[]');
        sendCmd('apply-tools:'+JSON.stringify(d));
        pushConsole('📡 Đã push '+d.length+' tool config', 'ok');
        return;
      }
      case 'tool-enable': {
        if(!args[0]) return pushConsole('✗ Cần tool id', 'err');
        let d = JSON.parse(localStorage.getItem(LS_ADMIN.toolsDisabled) || '[]');
        d = d.filter(x=>x!==args[0]);
        localStorage.setItem(LS_ADMIN.toolsDisabled, JSON.stringify(d));
        sendCmd('apply-tools:'+JSON.stringify(d));
        pushConsole('✓ Bật '+args[0], 'ok');
        return;
      }
      case 'tool-disable': {
        if(!args[0]) return pushConsole('✗ Cần tool id', 'err');
        let d = JSON.parse(localStorage.getItem(LS_ADMIN.toolsDisabled) || '[]');
        if(!d.includes(args[0])) d.push(args[0]);
        localStorage.setItem(LS_ADMIN.toolsDisabled, JSON.stringify(d));
        sendCmd('apply-tools:'+JSON.stringify(d));
        pushConsole('✗ Tắt '+args[0], 'warn');
        return;
      }
      case 'tool-status': {
        if(!args[0]) return pushConsole('✗ Cần tool id', 'err');
        const d = JSON.parse(localStorage.getItem(LS_ADMIN.toolsDisabled) || '[]');
        const isOff = d.includes(args[0]);
        pushConsole(`${isOff?'✗ TẮT':'✓ BẬT'}: ${args[0]}`, isOff?'warn':'ok');
        return;
      }

      // 2FA
      case '2fa-on': return toggle2FA(true);
      case '2fa-off': return toggle2FA(false);
      case '2fa-status': {
        const s = localStorage.getItem(VAULT_KEYS.twofaEnabled) === '1';
        pushConsole(s?'🔐 2FA đang BẬT':'🔓 2FA đang TẮT', s?'ok':'warn');
        return;
      }
      case '2fa-secret': {
        const s = localStorage.getItem(VAULT_KEYS.twofaSecret);
        pushConsole(s?'🔑 Secret: '+s:'✗ Chưa có secret', s?'ok':'warn');
        return;
      }
      case '2fa-copy': {
        const s = localStorage.getItem(VAULT_KEYS.twofaSecret);
        if(!s) return pushConsole('✗ Chưa có secret', 'warn');
        navigator.clipboard.writeText(s);
        pushConsole('📋 Đã copy secret', 'ok');
        return;
      }

      // Snapshot
      case 'snapshot': return createSnapshot();
      case 'snapshot-list': {
        const snaps = JSON.parse(localStorage.getItem(VAULT_KEYS.snapshots) || '[]');
        if(!snaps.length) return pushConsole('Chưa có snapshot', 'warn');
        snaps.forEach((s,i)=>pushConsole(`  [${i}] ${fmtTime(s.t)} · ${fmtBytes(s.payload.length)}`, 'info'));
        return;
      }
      case 'backup': return exportFull();

      // Logs
      case 'logs': {
        const logs = JSON.parse(localStorage.getItem(VAULT_KEYS.logs) || '[]');
        if(!logs.length) return pushConsole('Chưa có log', 'warn');
        logs.slice(-20).reverse().forEach(l=>pushConsole(`  [${fmtTime(l.t)}] ${l.action} ${l.detail||''}`, 'info'));
        return;
      }
      case 'logs-count': {
        const logs = JSON.parse(localStorage.getItem(VAULT_KEYS.logs) || '[]');
        pushConsole(`📊 ${logs.length} log entries`, 'info');
        return;
      }
      case 'logs-clear':
        if(!confirm('Xóa audit logs?')) return;
        localStorage.removeItem(VAULT_KEYS.logs);
        pushConsole('🗑 Đã xóa logs', 'ok');
        return;
      case 'cmd-log': {
        if(!CMD_LOG.length) return pushConsole('Chưa có lệnh nào', 'warn');
        CMD_LOG.slice(-30).reverse().forEach(l=>pushConsole(`  [${fmtTime(l.t)}] ${l.cmd} → ${l.msg||''}`, 'info'));
        return;
      }
      case 'cmd-log-clear': CMD_LOG = []; pushConsole('🗑 Đã xóa lịch sử lệnh', 'ok'); return;
      case 'tags': pushConsole('🏷 Tags nằm trong vault data (đã mã hóa)', 'warn'); return;

      // Tiện ích
      case 'random-id': return pushConsole('🎲 ' + Math.random().toString(36).slice(2,12), 'ok');
      case 'uuid': return pushConsole('🎲 ' + crypto.randomUUID(), 'ok');
      case 'echo': return pushConsole(args.join(' '), 'ok');
      case 'hash': {
        if(!args.length) return pushConsole('✗ Cần text', 'err');
        crypto.subtle.digest('SHA-256', new TextEncoder().encode(args.join(' ')))
          .then(b => pushConsole('SHA-256: ' + Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''), 'ok'));
        return;
      }

      // Quản trị
      case 'reset-admin-pwd':
        if(!confirm('Reset mật khẩu admin về admin123?')) return;
        localStorage.removeItem(LS_ADMIN.pwd);
        pushConsole('🔑 Đã reset về admin123', 'warn');
        return;
      case 'reset-fail':
        localStorage.removeItem(VAULT_KEYS.failCounter);
        pushConsole('♻ Đã reset bộ đếm sai', 'ok');
        return;
      case 'force-lock':
        sendCmdWithReply('lock').then(r=>{
          pushConsole(r.ok?'🔒 Đã force lock':'✗ '+(r.msg||'?'), r.ok?'ok':'err');
          logCmd('force-lock', r.msg);
        });
        return;
      case 'shutdown-vault':
        sendCmdWithReply('lock').then(()=>setTimeout(()=>sendCmd('reload'), 300));
        pushConsole('⛔ Đã shutdown vault', 'warn');
        return;

      default:
        pushConsole(`✗ Không hiểu lệnh: ${esc(c)}. Gõ "help" để xem.`, 'err');
    }
  } catch(e){
    pushConsole('✗ Lỗi: ' + e.message, 'err');
  }
}

function showHelp(){
  pushConsole('╔══════════════════════════════════════════════╗', 'ok');
  pushConsole('║      DANH SÁCH LỆNH — Sentinel Admin v3.0    ║', 'ok');
  pushConsole('╚══════════════════════════════════════════════╝', 'ok');
  pushConsole('', 'info');
  pushConsole('🎛 ĐIỀU KHIỂN VAULT:', 'info');
  pushConsole('  lock, reload, goto <page>, notify <text>, dialog <text>', 'info');
  pushConsole('  theme-light, theme-dark, dump-status, exec <js>', 'info');
  pushConsole('', 'info');
  pushConsole('📦 DỮ LIỆU VAULT:', 'info');
  pushConsole('  vault-check, vault-size, vault-at, salt-check, verify-integrity', 'info');
  pushConsole('', 'info');
  pushConsole('💥 WIPE:', 'info');
  pushConsole('  wipe-notes, wipe-files, wipe-docs, wipe-code, wipe-vault, wipe-todo', 'info');
  pushConsole('  wipe-logs, wipe-snaps, wipe-notepad, wipe-salt, wipe-all', 'info');
  pushConsole('', 'info');
  pushConsole('🗄 STORAGE:', 'info');
  pushConsole('  ls, ls-all, size, scan, get <key>, set <key> <val>, del <key>', 'info');
  pushConsole('  count-prefix <p>, export-key <key>, edit <key>', 'info');
  pushConsole('', 'info');
  pushConsole('🔧 TOOLS:', 'info');
  pushConsole('  tools-count, tools-disabled, tools-enable-all, tools-disable-all', 'info');
  pushConsole('  tool-enable <id>, tool-disable <id>, tool-status <id>, push-tools', 'info');
  pushConsole('', 'info');
  pushConsole('🔐 2FA: 2fa-on, 2fa-off, 2fa-status, 2fa-secret, 2fa-copy', 'info');
  pushConsole('📸 SNAPSHOT: snapshot, snapshot-list, backup', 'info');
  pushConsole('📜 LOGS: logs, logs-count, logs-clear, cmd-log, cmd-log-clear', 'info');
  pushConsole('⚙️ QUẢN TRỊ: reset-admin-pwd, reset-fail, force-lock, shutdown-vault', 'info');
  pushConsole('🔧 TIỆN ÍCH: echo, uuid, random-id, hash <text>', 'info');
  pushConsole('ℹ️ HỆ THỐNG: help, clear, version, whoami, time, date, ping, reload-self', 'info');
  pushConsole('', 'info');
  pushConsole('💡 Dùng ↑/↓ để xem lại lệnh đã gõ.', 'ok');
}

/* ============= BOOT ============= */
let ADMIN_TIMER = null;
function bootApp(){
  buildNav();
  initChannel();
  try { CMD_LOG = JSON.parse(localStorage.getItem(LS_ADMIN.cmdLog) || '[]'); } catch(e){ CMD_LOG = []; }
  try { CMD_HISTORY = JSON.parse(localStorage.getItem(LS_ADMIN.history) || '[]'); } catch(e){ CMD_HISTORY = []; }
  go('dash');
  updateBadges();
  // Ping vault
  setTimeout(()=>pingVault(false), 300);
  // Auto ping every 3s
  setInterval(()=>pingVault(false), 3000);
  // Admin session timer
  ADMIN_TIMER = setInterval(()=>{
    const el = $('adminTime');
    if(!el) return;
    const s = Math.floor((Date.now() - ADMIN_START)/1000);
    el.textContent = String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }, 1000);
  // Update vault status
  setInterval(updateVaultStatus, 1500);
  // Save cmd history
  setInterval(()=>{
    localStorage.setItem(LS_ADMIN.history, JSON.stringify(CMD_HISTORY.slice(-50)));
  }, 5000);
}

window.addEventListener('load', ()=>{
  if(sessionStorage.getItem(LS_ADMIN.session) === '1'){
    $('lock').classList.add('hidden');
    $('app').classList.remove('hidden');
    requestAnimationFrame(()=>$('app').classList.add('ready'));
    bootApp();
  }
  $('adminPwd').addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });
  // Global keyboard shortcuts
  document.addEventListener('keydown', e => {
    if($('lock').classList.contains('hidden')){
      if(e.key === 'Escape') lockApp();
      if(e.ctrlKey && e.key === 'k'){
        e.preventDefault();
        go('console');
        setTimeout(()=>$('consoleIn')?.focus(), 100);
      }
    }
  });
});
